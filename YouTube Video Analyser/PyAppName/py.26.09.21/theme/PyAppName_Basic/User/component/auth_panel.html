<div class="auth-card"><div class="panel-head"><span class="eyebrow">WELCOME</span><h2 id="auth-title">Sign in to your workspace</h2><p id="auth-subtitle">Access your saved videos, transcripts and jobs.</p></div>
<div class="auth-tabs"><button class="active" data-auth-view="login">Sign in</button><button data-auth-view="register">Create account</button></div>
<form id="login-form" class="auth-form"><label>Email address<input name="email" type="email" autocomplete="username" placeholder="you@example.com" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" minlength="10" required></label>
<button class="primary wide">Sign in <b>→</b></button><button type="button" class="link-button" data-auth-view="reset">Forgot password?</button></form>
<form id="register-form" class="auth-form hidden"><label>Your name<input name="display_name" required maxlength="60" placeholder="How should we call you?"></label>
<label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
<label>Password<input name="password" type="password" minlength="10" maxlength="128" required placeholder="At least 10 characters"></label>
<label>Confirm password<input name="confirm_password" type="password" minlength="10" required></label>
<button class="primary wide">Create local account <b>→</b></button><small class="muted">Your account and job history are stored on this computer.</small></form>
<form id="reset-form" class="auth-form hidden"><label>Email<input name="email" type="email" required></label>
<label>One-time recovery code<input name="recovery_code" required autocomplete="off"></label>
<label>New password<input name="new_password" type="password" minlength="10" required></label>
<button class="primary wide">Reset password <b>→</b></button><button type="button" class="link-button" data-auth-view="login">Back to sign in</button></form>
<div id="recovery-notice" class="notice hidden"></div><div id="auth-message" class="message hidden" role="status"></div>
<div class="auth-security">▣ &nbsp; Passwords are hashed locally. No cloud account is created.</div></div>
