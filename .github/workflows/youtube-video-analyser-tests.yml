name: YouTube Video Analyser tests
on:
  push:
    paths:
      - "YouTube Video Analyser/**"
      - ".github/workflows/youtube-video-analyser-tests.yml"
  pull_request:
    paths:
      - "YouTube Video Analyser/**"
      - ".github/workflows/youtube-video-analyser-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YouTube Video Analyser/PyAppName/py.26.09.21/theme/PyAppName_Basic/User
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "YouTube Video Analyser/PyAppName/py.26.09.21/theme/PyAppName_Basic/User/requirements.txt"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py db py core tests
      - run: pytest -q
